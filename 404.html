<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>2026 清教学園高校文化祭 オンライン鑑賞ガイド</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.
      
      // Determine if there is a repository name segment (e.g. /Viewing-Guide/)
      var pathSegmentsToKeep = 0;
      var pathName = window.location.pathname;
      if (pathName.startsWith('/Viewing-Guide')) {
        pathSegmentsToKeep = 1;
      } else {
        // Automatically check if the first segment is a repository name
        var segments = pathName.split('/').filter(Boolean);
        var knownRoutes = ['home', 'schedule', 'classes', 'congestion', 'bookmarks', 'timeline', 'map', 'admin', 'project'];
        if (segments.length > 0 && knownRoutes.indexOf(segments[0]) === -1 && !segments[0].includes('.')) {
          pathSegmentsToKeep = 1;
        }
      }

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
